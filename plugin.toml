[plugin]
id = "sea-battle"
name = "Sea Battle"
version = "0.3.4"
description = "Play Battleship in Astra with an interactive map, quick local mode, or an optional AI opponent."
author = "Voltur"
license = "MIT"
call_timeout_secs = 900

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python"]

[capabilities]
tools = true
ui_contributions = true

[permissions]
send_chat_message = { reason = "Lets Astra choose its fleet and play as your opponent." }

[config]
schema = "{ \"type\": \"object\", \"properties\": {} }"

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]
