[plugin]
id = "sea-battle"
name = "Sea Battle"
version = "0.5.0"
description = "Play Battleship in Astra: local or AI games, private online rooms, and random opponent search."
author = "Voltur"
license = "MIT"
call_timeout_secs = 900

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python"]

[capabilities]
tools = true
ui_contributions = true

[permissions]
send_chat_message = { reason = "Allows the selected Astra model to play Battleship and optionally announce a found opponent using Astra voice." }

[config]
schema = "{ \"type\": \"object\", \"properties\": {} }"

[platform]
os = ["windows", "linux", "macos"]
arch = ["x86_64", "aarch64"]
